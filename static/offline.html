<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe7d6">
<title>暂时离线 · 博主日报杂志</title>
<style>
  :root{--paper:#efe7d6;--ink:#0b0b0b;--acid:#c9f227;--muted:#6f675a}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;padding:clamp(28px,8vw,80px);display:flex;align-items:center;
    background:var(--paper);color:var(--ink);
    font-family:"Public Sans",ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .card{max-width:640px;border:2px solid var(--ink);background:#f7f3e9;box-shadow:10px 10px 0 var(--ink);padding:clamp(24px,5vw,44px)}
  .eyebrow{font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
  h1{font:700 clamp(34px,7vw,64px)/.98 Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:0 0 20px}
  h1 em{font-style:normal;background:var(--acid);padding:0 .08em}
  p{font-size:15px;line-height:1.7;color:#2b2620;margin:0 0 24px;max-width:48ch}
  a{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;padding:13px 20px;font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--acid)}
  a:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
  .mark{font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;margin-top:32px;color:var(--muted)}
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">BILMAGAZINE / OFFLINE</p>
    <h1>这一期<br>还没<em>连上</em>。</h1>
    <p>你现在处于离线状态。已经读过的页面仍会留在设备上；回到网络后刷新，就能继续读最新一期。</p>
    <a href="/">回到首页</a>
    <p class="mark">博主日报杂志 · 本地阅读版</p>
  </main>
</body>
</html>
